[package]
name = "turboreview"
version = "0.1.3"
edition = "2021"
description = "A terminal code-review tool for git: review working-tree changes and commits, stage files, leave line comments, and hand off to an AI agent."
license = "BSD-3-Clause"
repository = "https://github.com/nmbr7/turboreview"
homepage = "https://github.com/nmbr7/turboreview"
documentation = "https://docs.rs/turboreview"
readme = "README.md"
keywords = ["git", "code-review", "tui", "diff", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".turboreview/", ".github/", "docs/"]

[lib]
name = "turboreview"
path = "src/lib.rs"

[[bin]]
name = "turboreview"
path = "src/main.rs"

[dependencies]
git2 = "0.21"
ratatui = "0.30"
syntect = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arboard = "3"

[dev-dependencies]
tempfile = "3"
