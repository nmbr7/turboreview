[package]
name = "turboreview"
version = "0.1.0"
edition = "2021"

[lib]
name = "turboreview"
path = "src/lib.rs"

[[bin]]
name = "turboreview"
path = "src/main.rs"

[dependencies]
git2 = "0.21"
ratatui = "0.30"
syntect = "5"
syntect-tui = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
